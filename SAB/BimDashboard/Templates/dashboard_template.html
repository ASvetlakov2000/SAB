<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIM Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
    <div class="page">
        <header class="header">
            <div>
                <h1 class="title">BIM Dashboard</h1>
                <p class="subtitle" id="projectName">Проект: -</p>
                <p class="subtitle" id="sourceTypeValue">Источник: -</p>
                <p class="subtitle" id="generatedAt">Сформирован: -</p>
            </div>
        </header>

        <section class="summary-grid" id="summaryGrid">
            <article class="summary-card">
                <p class="summary-label">Всего элементов</p>
                <p class="summary-value" id="totalElements">0</p>
            </article>
        </section>

        <section class="workspace-grid">
            <aside class="columns-card">
                <h2 class="panel-title">Видимые колонки</h2>
                <p class="panel-note">Снимите лишние колонки, чтобы таблица помещалась на экран.</p>
                <div id="columnVisibilityMenu" class="column-menu"></div>
            </aside>

            <div class="table-workspace">
                <section class="controls-card">
                    <div class="controls-grid">
                        <label class="control-item">
                            <span>Поиск по всем колонкам</span>
                            <input id="searchInput" type="text" placeholder="Введите текст для поиска" />
                        </label>

                        <label class="control-item">
                            <span>Сортировать по</span>
                            <select id="sortColumnSelect"></select>
                        </label>

                        <div class="control-item actions">
                            <span>Действия</span>
                            <button id="resetFiltersButton" type="button">Сбросить настройки</button>
                        </div>
                    </div>
                    <p class="result-info" id="resultInfo">Показано строк: 0</p>
                </section>

                <section class="table-card">
                    <div id="tableContainer" class="table-container"></div>
                </section>
            </div>
        </section>
    </div>

    <!-- Блок передачи JSON из C# в JavaScript -->
    <script id="dashboard-data" type="application/json">{{DATA_JSON}}</script>
    <script src="dashboard.js"></script>
</body>
</html>
