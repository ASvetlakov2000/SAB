<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог проекта</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header-grid">
                <section class="header-section">
                    <p class="header-label">Каталог проекта</p>
                    <p class="header-value" id="catalogName">-</p>
                </section>

                <section class="header-section">
                    <p class="header-label">Источник</p>
                    <p class="header-value" id="sourceName">-</p>
                </section>

                <section class="header-section">
                    <p class="header-label">Формат источника</p>
                    <p class="header-value" id="sourceFormat">-</p>
                </section>

                <section class="header-section">
                    <p class="header-label">Всего элементов</p>
                    <p class="header-value" id="totalElementsHeader">0</p>
                </section>

                <section class="header-section">
                    <p class="header-label">Сформирован</p>
                    <p class="header-value" id="generatedAt">-</p>
                </section>
            </div>
        </header>

        <section class="workspace-grid">
            <aside class="left-panel">
                <section class="controls-card">
                    <h2 class="panel-title">Фильтрация и сортировка</h2>

                    <div class="controls-grid">
                        <label class="control-item control-full">
                            <span>Поиск по всем колонкам</span>
                            <input id="searchInput" type="text" placeholder="Введите текст для поиска" />
                        </label>

                        <label class="control-item">
                            <span>Фильтр по колонке</span>
                            <select id="filterColumnSelect"></select>
                        </label>

                        <label class="control-item">
                            <span>Значение фильтра</span>
                            <input id="filterValueInput" type="text" placeholder="Введите значение" />
                        </label>

                        <div class="control-item actions control-full">
                            <span>Действия</span>
                            <button id="resetFiltersButton" type="button">Сбросить настройки</button>
                        </div>
                    </div>

                    <p class="result-info" id="resultInfo">Показано строк: 0</p>
                </section>

                <section class="columns-card">
                    <h2 class="panel-title">Видимые колонки</h2>
                    <div id="columnVisibilityMenu" class="column-menu"></div>
                </section>
            </aside>

            <section class="table-card">
                <div id="tableContainer" class="table-container"></div>
            </section>
        </section>
    </div>

    <!-- Блок передачи JSON из C# в JavaScript -->
    <script id="dashboard-data" type="application/json">{{DATA_JSON}}</script>
    <script src="dashboard.js"></script>
</body>
</html>
